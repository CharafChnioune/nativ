name: Verify MCP Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/Nativ/Resources/MCPCatalog.json"
      - "scripts/install_github_mcp_server.sh"
      - "scripts/verify_mcp_catalog.py"
      - ".github/workflows/verify-mcp-catalog.yml"
  pull_request:
    paths:
      - "Sources/Nativ/Resources/MCPCatalog.json"
      - "scripts/install_github_mcp_server.sh"
      - "scripts/verify_mcp_catalog.py"
      - ".github/workflows/verify-mcp-catalog.yml"
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: verify-mcp-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: pip install "mcp>=1.0"

      - name: Install bundled MCP servers
        run: ./scripts/install_github_mcp_server.sh "$RUNNER_TEMP/nativ-mcp-servers"

      - name: Verify MCP catalog
        run: >
          python scripts/verify_mcp_catalog.py
          --bundled-directory "$RUNNER_TEMP/nativ-mcp-servers"
