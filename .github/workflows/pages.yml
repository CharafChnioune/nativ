name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/capture_download_history.mjs"
      - "scripts/capture_star_history.mjs"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-website
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Neywa-Labs/nativ'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Capture download history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/capture_download_history.mjs

      - name: Capture star history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/capture_star_history.mjs

      - name: Commit history snapshots
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { readFileSync } = require("node:fs");
            const paths = [
              "website/data/download-history.json",
              "website/data/star-history.json",
            ];
            const changedPaths = execFileSync(
              "git", ["diff", "--name-only", "HEAD", "--", ...paths],
              { encoding: "utf8" }
            ).trim().split("\n").filter(Boolean);
            if (changedPaths.length === 0) {
              core.info("History snapshots are unchanged.");
              return;
            }

            // GitHub signs API-authored commits to satisfy branch protection.
            // Reject a stale checkout rather than overwrite newer history.
            const expectedHeadOid = execFileSync(
              "git", ["rev-parse", "HEAD"], { encoding: "utf8" }
            ).trim();
            const result = await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { url }
                }
              }
            `, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName: "main",
                },
                expectedHeadOid,
                message: { headline: "Update download and star history" },
                fileChanges: {
                  additions: changedPaths.map((path) => ({
                    path,
                    contents: readFileSync(path).toString("base64"),
                  })),
                },
              },
            });
            core.info(`Created signed history snapshot: ${result.createCommitOnBranch.commit.url}`);

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
